# Publishes the docs site (GitHub Pages) from the repo's own Markdown on every push to main.
# The site has no content of its own: scripts/build-site.py renders README, GETTING-STARTED,
# the Idea Pack README, the ClubSlot example, CHANGELOG and LESSONS.
name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One pinned dependency, only used to build this site (not part of the kit or any project).
      - run: python3 -m pip install --user markdown==3.10.3
      - run: python3 scripts/build-site.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
