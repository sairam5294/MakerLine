# CI for the Product Kit repo itself: keeps generated files in sync and both starters green.
name: Kit CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: Kit sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # template/ is generated from plugin/. If sync.py changes anything, someone forgot to run it.
      - run: python3 scripts/sync.py && test -z "$(git status --porcelain template/)"
      # Both starters must use the kit's canonical design tokens + generator.
      - run: for s in starter starter-web; do cmp design/tokens.json $s/design/tokens.json || exit 1; cmp design/build-tokens.mjs $s/design/build-tokens.mjs || exit 1; done
      # Scripts must parse, and the safety hooks must block/allow exactly what they promise.
      - run: for f in scripts/*.sh template/scripts/*.sh template/.claude/hooks/*.sh; do bash -n "$f" || exit 1; done
      - run: bash tests/hooks.test.sh
      - run: bash tests/upgrade.test.sh
      - run: bash tests/idea-pack.test.sh
      - run: python3 scripts/build-idea-pack.py --check
      # Marketplace + plugin manifests must be valid JSON.
      - run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('plugin/.claude-plugin/plugin.json'))"
      # Workflow files must be valid GitHub Actions (catches mistakes that silently disable CI).
      - run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint template/.github/workflows/*.yml .github/workflows/*.yml

  expo:
    name: Expo starter
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: starter } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: starter/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  web:
    name: Web starter
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: starter-web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: starter-web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # On failure, print Playwright's page snapshots so the cause is readable in the log without downloading anything.
      - if: failure()
        run: for f in test-results/*/error-context.md; do [ -f "$f" ] && { echo "=== $f"; cat "$f"; }; done; true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: web-starter-playwright, path: starter-web/test-results, retention-days: 7 }
      - run: npx @lhci/cli autorun
